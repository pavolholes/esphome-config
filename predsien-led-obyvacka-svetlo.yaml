substitutions:
  device_name: predsien-led-obyvacka-svetlo
  friendly_name: Predsien LED Obyvacka Svetlo
  room: Predsien
  project_name: pavolholes.${friendly_name}
  project_version: "0.1"
  device_type: ESP32 WROOM
  # i2c_sda: GPIO21
  # i2c_scl: GPIO22
  # bme280_sensorName: "Digestor " # ${friendly_name}
  pwm_pin: GPIO16 # obyvacka svetlo
  pwm_pin2: GPIO17 # predsien LED
  button_pin: GPIO18
  button_pullup: INPUT_PULLUP
  button_inverted: "True"
  light_nightBrightnessLevel: "1.00"
  light_eveningBrightnessLevel: "1.00"
  light_fadingStep: "0.05"

packages:
  # higher in the list is higher priority (can overwrite values from includes below)
  common: !include pavolholes_common/common.yaml
  esp32: !include pavolholes_common/esp32.yaml
  # debug: !include pavolholes_common/debug.yaml
  esp32BluetoothProxy: !include pavolholes_common/esp32BluetoothProxy.yaml # including this changes the framework so the first time it have to be loaded to ESP using USB cable, not OTA!
  # bme_280: !include pavolholes_common/sensor/bme280.yaml
  gpio_button: !include pavolholes_common/binary_sensor/gpio_button.yaml

# logger:
#   level: VERY_VERBOSE # (default is DEBUG)
#   logs:
#     json: INFO
#     sensor: INFO
#     adc: INFO
#     ntc: INFO
#     resistance: INFO
#     text_sensor: INFO
#     api: INFO
#     ledc: INFO

output:
  - platform: ledc
    id: output_pwm
    pin: ${pwm_pin}
    frequency: 300Hz

  - platform: ledc
    id: output_pwm2
    pin: ${pwm_pin2}
    frequency: 300Hz

light:
  - platform: monochromatic
    name: "Obyvacka Svetlo"
    icon: mdi:led-strip-variant
    id: light_pwm
    output: output_pwm
    restore_mode: ALWAYS_OFF #RESTORE_DEFAULT_OFF
    gamma_correct: 1.0 # to start brightness at 0.01 not at 0.18

  - platform: monochromatic
    name: "Predsien LED"
    icon: mdi:led-strip-variant
    id: light_pwm2
    output: output_pwm2
    restore_mode: ALWAYS_OFF #RESTORE_DEFAULT_OFF
    gamma_correct: 1.0 # to start brightness at 0.01 not at 0.18

# diagnostic - find correct button pin
binary_sensor:
  - platform: gpio
    name: "Diag GPIO1"
    id: diag_gpio1
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_state:
      - logger.log:
          format: "[DIAG GPIO1] %s"
          level: INFO
          args: ['ONOFF(x)']
  - platform: gpio
    name: "Diag GPIO5"
    id: diag_gpio5
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_state:
      - logger.log:
          format: "[DIAG GPIO5] %s"
          level: INFO
          args: ['ONOFF(x)']
  - platform: gpio
    name: "Diag GPIO12"
    id: diag_gpio12
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_state:
      - logger.log:
          format: "[DIAG GPIO12] %s"
          level: INFO
          args: ['ONOFF(x)']
  - platform: gpio
    name: "Diag GPIO14"
    id: diag_gpio14
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_state:
      - logger.log:
          format: "[DIAG GPIO14] %s"
          level: INFO
          args: ['ONOFF(x)']
