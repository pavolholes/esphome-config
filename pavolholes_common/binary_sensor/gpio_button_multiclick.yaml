# USAGE
#   binary_sensor:
#     - platform: gpio
#       on_multi_click: !include { file: binary_sensor/gpio_button_multiclick.yaml, vars: { light_id: light_dimmer } }
# where "light_id" is "id" of the "light" managed by this button
#
# REQUIRED substitutions (must be defined by the device using this file):
#   light_id                   - id of the light managed by this button
#   light_initialBrightnessLevel - brightness used by Single Short Click when
#                                turning the light ON at night, i.e. while
#                                ha_time_for_lights_night is ON
#                                (e.g. "1.00" = full, "0.20" = dim). Decoupled
#                                from the dim level so turn-on brightness and
#                                double-click dim level can be tuned
#                                independently per device.
#   light_eveningBrightnessLevel - brightness used by Single Short Click when
#                                turning the light ON in the evening, i.e. while
#                                ha_time_for_lights_evening is ON.
#   light_nightBrightnessLevel - dim brightness level used in two places:
#                                1) lower bound of the Single Long Click fade loop
#                                2) the dim side of the Double Short Click cycle
#                                (dim <-> 100%), at any time of day
#                                (including evening)
#   light_fadingStep           - brightness step of the Single Long Click fade loop
#
# NOTE: the evening/night helpers (ha_time_for_lights_evening /
# ha_time_for_lights_night) gate the time windows; the brightness VALUE for
# turn-on comes from light_initialBrightnessLevel (night) and
# light_eveningBrightnessLevel (evening), while double-click always dims to
# light_nightBrightnessLevel.
#
# Button has three actions:
#   - Single Short Click - toggle light on/off; when turning on at night use
#     light_initialBrightnessLevel, in the evening light_eveningBrightnessLevel,
#     otherwise 100%.
#   - Single Long Click - while holding the button the brightness is changed
#     between light_nightBrightnessLevel and 100%; when released the brightness
#     change stops.
#   - Double Short Click - toggle brightness between light_nightBrightnessLevel
#     and 100% (no-op when both are 1.00 - set a dim night level per device
#     to make double-click visibly dim the light).
#
# NOTE: a matched multi-click sequence is consumed, so Double Short Click does
# NOT also trigger Single Short Click afterwards (verified live 2026-09-22).

# --- Double short click begin
# Timing: two short presses (each ON <= 0.5s) with a short gap (OFF <= 0.5s).
# Fires ~0.2s after the second release.
- timing:
    - ON for at most 0.5s #0.5
    - OFF for at most 0.5s #0.5
    - ON for at most 0.5s #0.5
    - OFF for at least 0.2s #0.2
  then:
    - logger.log:
        format: "[${friendly_name} Button] Double Short Clicked"
        level: INFO
    # Toggle between dim (night) level and full brightness.
    - light.turn_on:
        id: ${light_id}
        transition_length: 2s
        brightness: !lambda |-
          float currentBrightness = id(${light_id})->current_values.get_brightness();
          float nightBrightness = ${light_nightBrightnessLevel};
          float maxBrightness = 1.0;

          if (currentBrightness != maxBrightness) {
            ESP_LOGI("main", "[${friendly_name} Button Double Short Clicked] Current brightness is [%.2f] which is not equal to [%.2f]. Setting brightness to [%.2f].", currentBrightness, maxBrightness, maxBrightness);
            return maxBrightness;
          } else {
            ESP_LOGI("main", "[${friendly_name} Button Double Short Clicked] Current brightness is [%.2f] which equal to [%.2f]. Setting brightness to [%.2f].", currentBrightness, maxBrightness, nightBrightness);
            return nightBrightness;
          }

          // BELOW is to cycle brigthness anything > evening > night > evening > max > evening > night ...
          // (abandoned experiment, kept for reference - needs an evening-level
          // variable in the lambda, which the active code above does not use)
          // static bool fadeUp = true;
          // if (currentBrightness != eveningBrightness) {
          //     ESP_LOGI("main", "[${friendly_name} Button Double Short Clicked] Current brightness is [%.2f] which is not equal to [%.2f]. Setting brightness to [%.2f].", currentBrightness, eveningBrightness, eveningBrightness);
          //     if (currentBrightness < eveningBrightness) fadeUp = true;
          //     else fadeUp = false;
          //     return eveningBrightness;
          //   }
          // else {
          //   if (fadeUp) {
          //     ESP_LOGI("main", "[${friendly_name} Button Double Short Clicked] Current brightness is [%.2f] which is equal to [%.2f]. Direction is set to [up], so setting brightness to [%.2f].", currentBrightness, eveningBrightness, maxBrightness);
          //     fadeUp = false;
          //     return maxBrightness;
          //   } else {
          //     ESP_LOGI("main", "[${friendly_name} Button Double Short Clicked] Current brightness is [%.2f] which is equal to [%.2f]. Direction is set to [down]. Setting brightness to [%.2f].", currentBrightness, eveningBrightness, nightBrightness);
          //     fadeUp = true;
          //     return nightBrightness;
          //   }
          // }
# --- Double short click end
# --- Single long click begin
# Timing: button held down for at least 1s.
- timing:
    - ON for at least 1s #1s
  then:
    - logger.log:
        format: "[${friendly_name} Button] Single Long Clicked"
        level: INFO
    # While button is pressed, keep changing the brightness.
    - while:
        condition:
          binary_sensor.is_on: wall_button
        then:
          - logger.log:
              format: "[${friendly_name} Button] [Single Long Clicked] fading brightness..."
              level: INFO
          # Bounce the brightness between night level (bottom) and 100% (top).
          - light.dim_relative:
              id: ${light_id}
              relative_brightness: !lambda |-
                float currentBrightness = id(${light_id})->current_values.get_brightness();
                float nightBrightness = ${light_nightBrightnessLevel};
                float fadingStep = ${light_fadingStep};
                float maxBrightness = 1.0;
                static bool fadeUp = true;
                if (currentBrightness + fadingStep > maxBrightness) fadeUp = false;
                if (currentBrightness - fadingStep < nightBrightness) fadeUp = true;  
                
                if (fadeUp) return +fadingStep;
                else return -fadingStep;
              transition_length: 0.1s
          - delay: 0.3s # Make brightness change slower so human can stop it.
# --- Single long click end
# --- Single short click begin
# Timing: one short press (ON <= 0.5s), confirmed after 0.5s of release.
- timing:
    - ON for at most 0.5s #0.5
    - OFF for at least 0.5s #0.5
  then:
    - logger.log:
        format: "[${friendly_name} Button] Single Short Clicked"
        level: INFO
    - if:
        condition:
          - light.is_on: ${light_id}
        then:
          # Light is on -> turn it off, no brightness logic needed.
          - logger.log:
              format: "[${friendly_name} Button Single Short Clicked] Light is on, so turn it off."
              level: INFO
          - light.turn_off: ${light_id}
        else:
          # Light is off -> turn it on. Brightness depends on time of day:
          # night -> initial brightness, evening -> evening brightness,
          # day -> full brightness.
          - logger.log:
              format: "[${friendly_name} Button Single Short Clicked] Light is off, so turn it on..."
              level: INFO
          - if:
              condition:
                - binary_sensor.is_on: ha_time_for_lights_night
              then:
                - logger.log:
                    format: "[${friendly_name} Button Single Short Clicked] Night time helper is ON, setting brightness to ${light_initialBrightnessLevel}."
                    level: INFO
                - light.turn_on:
                    id: ${light_id}
                    brightness: ${light_initialBrightnessLevel}
              else:
                - if:
                    condition:
                      - binary_sensor.is_on: ha_time_for_lights_evening
                    then:
                      - logger.log:
                          format: "[${friendly_name} Button Single Short Clicked] Evening time helper is ON, setting brightness to ${light_eveningBrightnessLevel}."
                          level: INFO
                      - light.turn_on:
                          id: ${light_id}
                          brightness: ${light_eveningBrightnessLevel}
                    else:
                      - logger.log:
                          format: "[${friendly_name} Button Single Short Clicked] No time helper is ON, setting brightness to 1.00."
                          level: INFO
                      - light.turn_on:
                          id: ${light_id}
                          brightness: 1.00
# --- Single short click end
