# Home Assistant Time Helpers for Light Control
# These binary_sensors read the state from HA time helpers
# Used to determine evening/night time periods instead of fixed hours

binary_sensor:
  - platform: homeassistant
    id: ha_time_for_lights_evening
    entity_id: binary_sensor.time_for_lights_evening
    internal: true
    on_state:
      - logger.log:
          format: "[${friendly_name} HA Helper] time_for_lights_evening changed to: ${state}"
          level: INFO

  - platform: homeassistant
    id: ha_time_for_lights_night
    entity_id: binary_sensor.time_for_lights_night
    internal: true
    on_state:
      - logger.log:
          format: "[${friendly_name} HA Helper] time_for_lights_night changed to: ${state}"
          level: INFO
