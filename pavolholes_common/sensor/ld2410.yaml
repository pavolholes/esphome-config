# Watchdog: Monitor LD2410 sensor health and auto-restart if unavailable
# Requires restart_button id defined in common.yaml
globals:
  - id: last_ld2410_data_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_ld2410_restart_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ld2410_needs_restart
    type: bool
    restore_value: no
    initial_value: "false"


script:
  - id: watchdog_restart
    then:
      - logger.log:
          format: "[WATCHDOG] Restarting due to LD2410 sensor unavailability"
          level: ERROR
          tag: "watchdog"
      - delay: 2s
      - button.press: restart_button