substitutions:
  device_name: test-optical-probe
  friendly_name: Test Optical Probe
  room: Dvor
  project_name: pavolholes.${friendly_name}
  project_version: "0.3"
  device_type: ESP32-C3-super-mini

  powermeter_iec62056_uart_rx: GPIO6  # GPIO3 - Hardware RX (biely vodič z senzora TXD)
  powermeter_iec62056_uart_tx: TX  # GPIO1 - Hardware TX (žltý vodič z senzora RXD)

packages:
  # higher in the list is higher priority (can overwrite values from includes below)
  common: !include pavolholes_common/common.yaml
  # debug: !include pavolholes_common/debug.yaml
  esp8266: !include pavolholes_common/esp8266.yaml
  web_server: !include pavolholes_common/web_server.yaml # if ESP32 Bluetooth is used this needs to be disabled
  # powermeter_sml: !include pavolholes_common/sensor/powermeter_sml.yaml
  powermeter_iec62056: !include pavolholes_common/sensor/powermeter_iec62056.yaml