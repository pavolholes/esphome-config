# CHANGES
# 0.5 2026-07-02 Pavol
#   - LD2410: disabled gates 6-8 (move & still thresholds set to 100)
#     Room range is 3.5m from sensor, gates 6-8 (4.5-6m) are outside room
#     These gates were generating noise (g7/g8 move energy 6) causing false positives
#     activation: reverted to 1 move + 2 still gates (noise gates now disabled)
#     maintenance: 2 still gates
# 0.4 2026-06-29 Pavol
#   - LD2410 presence: increased activation move gates to 2
#     activation: 2 move + 2 still gates
#     Real movement (person entering bed) generates 5+ move gates
#     Ambient noise generates only 1 move gate -> eliminates false positives
# 0.3 2026-06-28 Pavol
#   - LD2410 presence: override hysteresis logic for bedroom
#     activation: 1 move + 2 still gates (instead of default 3 still)
#     maintenance: 2 still gates (instead of default 3 still)
#     Better detection of static sleeping person while still requiring move gate to activate
# 0.2 2026-04-23 Pavol
#   - disabled debug logging
# 0.1 2025-05-29 Pavol
#   - initial version

substitutions:
  device_name: spalna-klima
  friendly_name: Spalna Klima
  room: Spalna
  project_name: pavolholes.${friendly_name}
  project_version: "0.1"
  device_type: ESP32 WROOM

  # LG Klima
  temperature_sensor_entity_id: sensor.spalna_multisenzor_temperature

  # I2C: BME280 (H&T&P), BH1750 (lux)
  i2c_sda: GPIO22
  i2c_scl: GPIO21

  # UART: LD2410
  uart_ld2410_tx: GPIO17 # RX
  uart_ld2410_rx: GPIO16 # TX

  # LD2410: Bedroom-specific hysteresis (sleeping person is mostly static)
  # Gates 6-8 disabled (thresholds set to 100) - outside room range (3.5m)
  ld2410_activation_move_gates: "1"
  ld2410_activation_still_gates: "2"
  ld2410_maintenance_still_gates: "2"

packages:
  # higher in the list is higher priority (can overwrite values from includes below)
  common: !include pavolholes_common/common.yaml
  esp32: !include pavolholes_common/esp32.yaml
  # debug: !include pavolholes_common/debug.yaml
  esp32BluetoothProxy: !include pavolholes_common/esp32BluetoothProxy.yaml # including this changes the framework so the first time it have to be loaded to ESP using USB cable, not OTA!
  lg_airconditioner: !include pavolholes_common/lg_airconditioner.yaml
  bh1750: !include pavolholes_common/sensor/bh1750.yaml
  bme280: !include pavolholes_common/sensor/bme280.yaml
  ld2410: !include pavolholes_common/sensor/ld2410.yaml

# LD2410: Thresholds for gates 6-8 set to 100 via HA API (persistent in EEPROM)
# Room is 3.5m from sensor, gates 6-8 (4.5-6m) are outside room and generate noise

